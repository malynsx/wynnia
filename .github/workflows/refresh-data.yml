name: Refresh game data

on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/build_data.py
      - name: Commit if anything changed
        run: |
          git config user.name "wynnia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data img
          git diff --cached --quiet || git commit -m "Refresh game data"
          git push
